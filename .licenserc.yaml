header:
  license:
    spdx-id: Apache-2.0
    copyright-owner: Timofey Brukhanchik (asyncbtd)
  comment: on-failure
  language:
    V:
      comment_style_id: DoubleSlash
      extensions:
        - ".v"
        - ".vsh"
    C:
      comment_style_id: SlashAsterisk
      extensions:
        - ".c"
        - ".h"
  paths:
    - "**/*.v"
    - "**/*.vsh"
    - "**/*.c"
    - "**/*.h"
  paths-ignore:
    - "**/.git/**"
